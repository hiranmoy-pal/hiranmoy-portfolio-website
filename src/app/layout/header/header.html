<header class="site-header" [class.scrolled]="isScrolled()">
    <div class="header-shell">
        <!-- Brand -->
        <a class="brand" (click)="selectSection('home',$event)" aria-label="Hiranmoy Pal Home">
            <span class="brand-avatar">
                <img src="Hiranmoy_Pic.jpg" alt="Hiranmoy Pal" />
            </span>
            <span class="brand-name">Hiranmoy Pal<span class="brand-dot"></span></span>
        </a>

        <!-- Desktop Navigation -->
        <nav class="desktop-nav" aria-label="Primary Navigation">
            @for (item of navItems; track item.id) {
            <a [href]="'#' + item.id" class="nav-link" [class.active]="activeSection() === item.id"
                (click)="selectSection(item.id,$event)">
                {{ item.label }}
            </a>
            }
        </nav>

        <!-- Right Actions: Socials + Theme + Mobile Toggle -->
        <div class="header-actions">
            <div class="social-cluster" aria-label="Social Links">
                @for (social of socialLinks; track social.name) {
                <a [href]="social.url" [attr.target]="social.url.startsWith('mailto:') ? null : '_blank'"
                    [attr.rel]="social.url.startsWith('mailto:') ? null : 'noopener noreferrer'" class="social-btn"
                    [attr.aria-label]="social.name" [title]="social.name">
                    <i class="fa" [ngClass]="social.icon" aria-hidden="true"></i>
                </a>
                }
            </div>

            <span class="action-divider" aria-hidden="true"></span>

            <button type="button" class="theme-btn" (click)="toggleTheme()"
                [attr.aria-label]="isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
                [title]="isDark() ? 'Light mode' : 'Dark mode'">
                <i class="fa" [ngClass]="isDark() ? 'fa-sun-o' : 'fa-moon-o'" aria-hidden="true"></i>
            </button>

            <button type="button" class="menu-toggle" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen()"
                aria-label="Toggle navigation menu">
                <i class="fa" [ngClass]="isMenuOpen() ? 'fa-times' : 'fa-bars'" aria-hidden="true"></i>
            </button>
        </div>
    </div>

    <!-- Tablet / iPad & Mobile Glass Drawer -->
    @if (isMenuOpen()) {
    <div class="mobile-backdrop" (click)="closeMenu()"></div>
    <nav class="mobile-drawer" aria-label="Mobile Navigation">
        <div class="mobile-links">
            @for (item of navItems; track item.id) {
            <a [href]="'#' + item.id" class="mobile-nav-link" [class.active]="activeSection() === item.id"
                (click)="selectSection(item.id,$event)">
                <span>{{ item.label }}</span>
                <i class="fa fa-angle-right" aria-hidden="true"></i>
            </a>
            }
        </div>

        <div class="mobile-socials">
            @for (social of socialLinks; track social.name) {
            <a [href]="social.url" [attr.target]="social.url.startsWith('mailto:') ? null : '_blank'"
                [attr.rel]="social.url.startsWith('mailto:') ? null : 'noopener noreferrer'" class="social-btn"
                [attr.aria-label]="social.name">
                <i class="fa" [ngClass]="social.icon" aria-hidden="true"></i>
            </a>
            }
        </div>
    </nav>
    }
</header>
